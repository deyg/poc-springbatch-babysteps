spring.application.name=spring-batch-poc
# Metadados persistentes permitem inspecionar execuções e demonstrar restart.
spring.datasource.url=jdbc:h2:file:./data/batch
spring.datasource.username=sa
spring.datasource.password=
spring.batch.jdbc.initialize-schema=always

# Mantem os logs do framework concisos e destaca a trilha didatica da aplicacao.
debug=false
logging.level.root=INFO
logging.level.br.com.poc.batch=DEBUG
logging.level.org.springframework.batch=INFO
logging.level.org.springframework.jdbc=INFO
